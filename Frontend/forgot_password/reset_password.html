<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | ShopVerse</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="auth-page" style="display: grid; place-items: center; min-height: 100vh; background: var(--grad-glow);">

    <div class="auth-card" id="reset-card" style="width: 100%; max-width: 400px; padding: 2.5rem; background: var(--clr-surface); border: 1px solid var(--clr-border); border-radius: var(--radius-lg); display: none;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <a href="../index.html" style="font-size: 1.8rem; font-weight: 800; background: var(--grad-primary); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-decoration: none;">✦ ShopVerse</a>
            <h1 style="margin-top: 1.5rem; font-size: 1.5rem;">Create New Password</h1>
            <p style="color: var(--clr-muted); font-size: 0.9rem; margin-top: 0.5rem;">Please enter your new secure password.</p>
        </div>

        <form id="reset-form">
            <input type="hidden" id="token">
            
            <div class="form-group" style="margin-bottom: 1.2rem;">
                <label class="form-label">New Password</label>
                <div style="position: relative;">
                    <i class="ph ph-lock" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--clr-muted);"></i>
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required style="padding-left: 3rem;">
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 1.5rem;">
                <label class="form-label">Confirm Password</label>
                <div style="position: relative;">
                    <i class="ph ph-lock-key" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--clr-muted);"></i>
                    <input type="password" id="confirm_password" class="form-input" placeholder="••••••••" required style="padding-left: 3rem;">
                </div>
            </div>

            <button type="submit" id="btn-submit" class="btn-primary" style="width: 100%; padding: 0.8rem; font-weight: 600;">
                Update Password
            </button>
        </form>

        <div id="message-box" style="margin-top: 1.5rem; padding: 1rem; border-radius: var(--radius-sm); font-size: 0.9rem; display: none;"></div>
    </div>

    <div id="invalid-token" style="text-align: center; display: none;">
        <i class="ph ph-warning-circle" style="font-size: 4rem; color: var(--clr-error);"></i>
        <h1 style="margin-top: 1rem;">Invalid or Expired Link</h1>
        <p style="color: var(--clr-muted); margin-bottom: 2rem;">This password reset link is no longer valid.</p>
        <a href="forgot_password.html" class="btn-primary" style="padding: 0.8rem 2rem;">Request New Link</a>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        // Hardcoded Root-Relative Paths (Most stable for WAMP)
        const BASE_API_URL = '/Ecommerce_site/Backend/forgot_password';
        const LOGIN_URL = '/Ecommerce_site/Frontend/login.html';

        async function init() {
            if (!token) {
                document.getElementById('invalid-token').style.display = 'block';
                return;
            }

            try {
                const res = await fetch(`${BASE_API_URL}/reset_password.php?token=${token}`);
                if (!res.ok) throw new Error(`Server returned status ${res.status}`);
                
                const data = await res.json();

                if (data.success) {
                    document.getElementById('reset-card').style.display = 'block';
                    document.getElementById('token').value = token;
                } else {
                    document.getElementById('invalid-token').style.display = 'block';
                }
            } catch (err) {
                document.getElementById('invalid-token').style.display = 'block';
            }
        }

        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-submit');
            const msgBox = document.getElementById('message-box');
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm_password').value;

            if (password !== confirm) {
                msgBox.style.display = 'block';
                msgBox.textContent = "Passwords do not match.";
                msgBox.style.background = 'rgba(239, 68, 68, 0.1)';
                msgBox.style.color = 'var(--clr-error)';
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="btn-spinner"></span> Updating...';

            try {
                const res = await fetch(`${BASE_API_URL}/reset_password.php`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password })
                });
                
                if (!res.ok) throw new Error(`HTTP Error: ${res.status}`);
                
                const data = await res.json();

                msgBox.style.display = 'block';
                msgBox.textContent = data.message;
                msgBox.style.background = data.success ? 'rgba(16, 185, 129, 0.1)' : 'rgba(239, 68, 68, 0.1)';
                msgBox.style.color = data.success ? 'var(--clr-success)' : 'var(--clr-error)';

                if (data.success) {
                    setTimeout(() => window.location.href = LOGIN_URL, 2000);
                }
            } catch (err) {
                console.error(err);
                msgBox.style.display = 'block';
                msgBox.textContent = "Error: " + err.message;
            } finally {
                btn.disabled = false;
                btn.textContent = 'Update Password';
            }
        });

        init();
    </script>
</body>
</html>
