<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | ShopVerse</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- We don't use session_check here because this is a public page -->
</head>
<body class="auth-page" style="display: grid; place-items: center; min-height: 100vh; background: var(--grad-glow);">

    <div class="auth-card" style="width: 100%; max-width: 400px; padding: 2.5rem; background: var(--clr-surface); border: 1px solid var(--clr-border); border-radius: var(--radius-lg); box-shadow: var(--shadow-glow);">
        <div style="text-align: center; margin-bottom: 2rem;">
            <a href="../index.html" style="font-size: 1.8rem; font-weight: 800; background: var(--grad-primary); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-decoration: none;">✦ ShopVerse</a>
            <h1 style="margin-top: 1.5rem; font-size: 1.5rem;">Reset Your Password</h1>
            <p style="color: var(--clr-muted); font-size: 0.9rem; margin-top: 0.5rem;">Enter your email to receive a recovery link.</p>
        </div>

        <form id="forgot-form">
            <div class="form-group" style="margin-bottom: 1.5rem;">
                <label class="form-label">Email Address</label>
                <div style="position: relative;">
                    <i class="ph ph-envelope" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--clr-muted);"></i>
                    <input type="email" id="email" class="form-input" placeholder="name@example.com" required style="padding-left: 3rem;">
                </div>
            </div>

            <button type="submit" id="btn-submit" class="btn-primary" style="width: 100%; padding: 0.8rem; font-weight: 600;">
                Send Recovery Link
            </button>
        </form>

        <div id="message-box" style="margin-top: 1.5rem; padding: 1rem; border-radius: var(--radius-sm); font-size: 0.9rem; display: none;"></div>

        <div style="margin-top: 2rem; text-align: center; font-size: 0.9rem; border-top: 1px solid var(--clr-border); padding-top: 1.5rem;">
            Remembered your password? <a href="../login.html" style="color: var(--clr-primary-light); font-weight: 600; text-decoration: none;">Sign In</a>
        </div>
    </div>

    <script>
        let csrfToken = '';

        // Fetch CSRF token on page load
        (async function() {
            try {
                const resp = await fetch('../../Backend/csrf_token.php', { credentials: 'include' });
                const data = await resp.json();
                if (data.success) csrfToken = data.csrf_token;
            } catch(e) {}
        })();

        document.getElementById('forgot-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-submit');
            const msgBox = document.getElementById('message-box');
            const email = document.getElementById('email').value;

            btn.disabled = true;
            btn.innerHTML = '<span class="btn-spinner"></span> Sending...';
            msgBox.style.display = 'none';

            try {
                const res = await fetch('../../Backend/forgot_password/forgot_password.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, csrf_token: csrfToken })
                });
                const data = await res.json();

                msgBox.style.display = 'block';
                if (data.success && data.reset_link) {
                    msgBox.innerHTML = `<strong>${data.message}</strong><br><br><a href="${data.reset_link}" style="color:var(--clr-primary-light); word-break:break-all;">${data.reset_link}</a>`;
                } else {
                    msgBox.textContent = data.message;
                }
                
                msgBox.style.background = data.success ? 'rgba(16, 185, 129, 0.1)' : 'rgba(239, 68, 68, 0.1)';
                msgBox.style.color = data.success ? 'var(--clr-success)' : 'var(--clr-error)';
                msgBox.style.border = `1px solid ${data.success ? 'var(--clr-success)' : 'var(--clr-error)'}`;

                if (data.success) {
                    document.getElementById('forgot-form').reset();
                }
            } catch (err) {
                msgBox.style.display = 'block';
                msgBox.textContent = "Network error. Please try again.";
                msgBox.style.background = 'rgba(239, 68, 68, 0.1)';
                msgBox.style.color = 'var(--clr-error)';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Send Recovery Link';
            }
        });
    </script>

</body>
</html>
