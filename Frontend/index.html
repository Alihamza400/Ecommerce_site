<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopVerse — Shop Smarter, Live Better</title>
  <meta name="description" content="Welcome to ShopVerse. Browse our premium products." />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/ai_assistant.css" />
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1/src/index.js" defer></script>
  <script src="js/session_check.js"></script>
  <script src="js/ai_assistant.js" defer></script>
</head>
<body>
  <!-- Navigation -->
  <header class="site-header">
    <div class="nav-container">
      <a href="index.html" class="logo">✦ ShopVerse</a>
      <nav class="nav-links">
        <a href="index.html">All Products</a>
      </nav>
      
      <div class="search-container">
        <i class="ph ph-magnifying-glass search-icon"></i>
        <input type="text" id="ai-search-input" placeholder="Search with AI (e.g. 'summer beach wear')" class="search-input">
        <div id="ai-search-results" class="semantic-search-results"></div>
      </div>

      <div class="nav-actions">
        <!-- Replaced dynamically by JS based on login state -->
        <div id="auth-actions">
           <a href="login.html" class="btn-ghost">Sign In</a>
           <a href="register.html" class="btn-primary-sm">Create Account</a>
        </div>
      </div>
    </div>
  </header>

  <main id="index-main">
    <!-- Hero Section -->
    <section class="hero-section">
      <div class="hero-content">
        <h1>Welcome to the Future of Commerce.</h1>
        <p>Premium quality. Unbeatable prices. Delivered to your door.</p>
        <div class="hero-buttons">
          <a href="#products-grid" class="btn-primary">Shop Now</a>
        </div>
      </div>
    </section>

    <!-- Products Grid -->
    <section class="featured-products">
      <div class="section-header">
        <h2>Latest Arrivals</h2>
      </div>

      <!-- Container built by JS -->
      <div id="products-grid" class="product-grid">
         <div class="loading-state">Loading products...</div>
      </div>
    </section>
  </main>

  <style>
    /* Add base layout rules over auth-specific style.css */
    .site-header {
      background: var(--clr-surface);
      border-bottom: 1px solid var(--clr-border);
      padding: 1rem 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-container {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 2rem;
    }
    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      background: var(--grad-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
      white-space: nowrap;
    }
    .nav-links { display: flex; gap: 1.5rem; }
    .nav-links a { font-weight: 500; transition: var(--trans-fast); }
    .nav-links a:hover { color: var(--clr-primary-light); }
    .btn-ghost { padding: 0.5rem 1rem; font-weight: 600; white-space: nowrap; }
    .btn-primary-sm {
      padding: 0.5rem 1rem; background: var(--grad-primary); border-radius: var(--radius-sm);
      font-weight: 600; transition: var(--trans-slow); color: #fff; white-space: nowrap;
    }
    
    /* Search Styles - Production Refinement */
    .search-container {
        position: relative;
        flex: 1;
        max-width: 500px;
        display: flex;
        align-items: center;
    }
    .search-input {
        width: 100%;
        padding: 0.75rem 1rem 0.75rem 2.75rem;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--clr-border);
        border-radius: var(--radius-md);
        color: white;
        outline: none;
        transition: var(--trans-normal);
        font-size: 0.9rem;
    }
    .search-input:focus { 
        border-color: var(--clr-primary); 
        background: rgba(255, 255, 255, 0.05);
        box-shadow: 0 0 20px rgba(124, 58, 237, 0.15); 
    }
    .search-icon { 
        position: absolute; 
        left: 1rem; 
        color: var(--clr-muted); 
        font-size: 1.1rem;
        z-index: 10;
    }
    .nav-actions { display: flex; align-items: center; gap: 1rem; }

    .hero-section {
      text-align: center;
      padding: 8rem 1rem;
      background: var(--grad-glow);
    }
    .hero-content h1 { font-size: 4rem; font-weight: 800; margin-bottom: 1.5rem; letter-spacing: -1px; }
    .hero-content p { font-size: 1.4rem; color: var(--clr-muted); margin-bottom: 3rem; max-width: 600px; margin-left: auto; margin-right: auto; }
    .featured-products { max-width: 1400px; margin: 6rem auto; padding: 0 2rem; }
    .product-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 3rem;
    }
    .product-card {
      background: var(--clr-surface-2); border: 1px solid var(--clr-border);
      border-radius: var(--radius-lg); overflow: hidden; transition: var(--trans-slow);
    }
    .product-card:hover { transform: translateY(-10px); box-shadow: var(--shadow-glow); }
    .product-image {
      height: 260px; background: rgba(255,255,255,0.02); display: flex; align-items: center; justify-content: center;
      color: var(--clr-muted); font-size: 5rem; overflow: hidden;
    }
    .product-details { padding: 2rem; }
    .product-brand { font-size: 0.85rem; color: var(--clr-accent); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
    .product-title { font-size: 1.25rem; font-weight: 800; margin: 0.75rem 0; color: #fff; }
    .product-desc { font-size: 1rem; color: var(--clr-muted); margin-bottom: 1.5rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;}
    .product-footer { display: flex; justify-content: space-between; align-items: center; }
    .product-price { font-size: 1.5rem; font-weight: 900; color: #fff; }
    .add-to-cart { background: var(--clr-primary); color: #fff; border: none; padding: 0.75rem 1rem; border-radius: 99px; cursor: pointer; transition: var(--trans-fast); display: flex; align-items: center; justify-content: center; font-size: 1.4rem;}
    .add-to-cart:hover { background: var(--clr-primary-light); transform: scale(1.1); }
  </style>

  <script src="js/catalog.js?v=2"></script>
</body>
</html>
