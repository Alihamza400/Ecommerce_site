<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — ShopVerse</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css?v=9291" />
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1/src/index.js" defer></script>
  <script src="js/session_check.js"></script>
</head>
<body class="entrance-fade">
<main class="auth-page" id="login-page">

  <aside class="auth-panel">
    <div class="orb orb-1 float-slow"></div>
    <div class="orb orb-2 float-medium"></div>
    <div class="auth-panel-logo">✦ ShopVerse</div>
    <h1 class="auth-panel-tagline">Welcome<br><span>Back!</span></h1>
    <p class="auth-panel-sub">Your orders, deals, and wishlist are waiting for you. Sign in to continue.</p>
    <ul class="auth-features">
      <li class="auth-feature"><span class="auth-feature-icon">📦</span><span class="auth-feature-text">Track your orders</span></li>
      <li class="auth-feature"><span class="auth-feature-icon">⚡</span><span class="auth-feature-text">1-click checkout</span></li>
    </ul>
  </aside>

  <section class="auth-form-side">
    <div class="auth-card reveal">
      <div class="auth-card-header">
        <h2 class="auth-card-title">Sign in to your account</h2>
        <p class="auth-card-subtitle">Don't have an account? <a href="register.html">Create one free</a></p>
      </div>

      <div class="alert alert-error" id="login-alert" role="alert">
        <i class="ph ph-warning-circle"></i><span id="login-alert-msg"></span>
      </div>

      <form id="login-form" class="reveal delay-2" novalidate>
        <div class="form-group">
          <label class="form-label" for="login-email">Email Address</label>
          <div class="input-wrapper">
            <input class="form-input" type="email" id="login-email" name="email" required />
            <i class="ph ph-envelope input-icon"></i>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <div class="input-wrapper">
            <input class="form-input" type="password" id="login-password" name="password" required />
            <i class="ph ph-lock input-icon"></i>
            <button type="button" class="btn-toggle-password" id="toggle-login-pass">
              <i class="ph ph-eye" id="eye-login-pass"></i>
            </button>
          </div>
          <div style="text-align: right; margin-top: 0.5rem;">
            <a href="forgot_password/forgot_password.html" style="font-size: 0.85rem; color: var(--clr-primary-light); text-decoration: none;">Forgot Password?</a>
          </div>
        </div>


        <button type="submit" class="btn-primary" id="login-submit" class="btn-ripple">
          <span class="btn-text">Sign In</span><span class="btn-spinner"></span>
        </button>

        <div class="auth-divider"><span>or continue with</span></div>

        <a href="../Backend/oauth/google_login.php" class="btn-google-gigantic">
          <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google">
          <span>Continue with Google</span>
        </a>
      </form>
    </div>
  </section>

</main>
<script src="js/auth.js"></script>
  <script src="js/animations.js?v=9676"></script>
</body>
</html>
