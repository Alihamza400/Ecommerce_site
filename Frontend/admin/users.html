<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Directory | ShopVerse Elite</title>
    
    <!-- Design Foundation -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
    
    <!-- Icons & Fonts -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>

    <div class="admin-container" id="admin-main">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">ShopVerse Elite</div>
            
            <nav class="nav-list">
                <a href="dashboard.html" class="nav-link">
                    <i class="ph ph-squares-four"></i> Dashboard
                </a>
                <a href="orders.html" class="nav-link">
                    <i class="ph ph-shopping-cart"></i> Orders
                </a>
                <a href="products.html" class="nav-link">
                    <i class="ph ph-package"></i> Products
                </a>
                <a href="payments.html" class="nav-link">
                    <i class="ph ph-credit-card"></i> Payments
                </a>
                <a href="vendors.html" class="nav-link">
                    <i class="ph ph-storefront"></i> Vendors
                </a>
                <a href="users.html" class="nav-link active">
                    <i class="ph ph-users"></i> Customers
                </a>
            </nav>

            <div style="margin-top: auto;">
                <a href="../index.html" class="nav-link">
                    <i class="ph ph-arrow-left"></i> Back to Store
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="header-flex">
                <div>
                    <h1 class="page-title">User Management</h1>
                    <p style="color: var(--clr-muted);">Review and manage all platform accounts.</p>
                </div>
            </div>

            <!-- Stats Row -->
            <div class="stats-row" style="grid-template-columns: repeat(3, 1fr);">
                <div class="stat-card">
                    <div class="stat-icon"><i class="ph ph-users"></i></div>
                    <div>
                        <span class="stat-value" id="stat-total-users">0</span>
                        <span class="stat-label">Total Registered</span>
                    </div>
                </div>
            </div>

            <!-- Users Table -->
            <div class="order-table-container">
                <div class="table-header">
                    <h2 style="font-size: 1.1rem;">Customer List</h2>
                    <div class="search-box" style="flex:1; max-width:300px; position:relative; margin-left:2rem;">
                        <i class="ph ph-magnifying-glass" style="position:absolute; left:1rem; top:50%; transform:translateY(-50%); color:var(--clr-muted);"></i>
                        <input type="text" id="user-search" placeholder="Search by name or email..." style="width:100%; padding:0.5rem 1rem 0.5rem 2.5rem; background:var(--clr-surface-2); border:1px solid var(--clr-border); border-radius:var(--radius-sm); color:#fff; outline:none;" onkeyup="filterUsers()">
                    </div>
                </div>
                
                <div class="table-wrapper">
                    <table id="users-table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Status</th>
                                <th style="text-align:right;">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="users-tbody">
                            <!-- JS will inject rows here -->
                            <tr>
                                <td colspan="5" style="text-align:center; padding: 4rem;">
                                    <div class="btn-spinner" style="display:block; border-top-color:var(--clr-primary);"></div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Alert / Toast -->
    <div id="admin-alert" class="alert" style="position:fixed; bottom:2rem; right:2rem; z-index:100; margin-bottom:0; width:320px;">
        <span id="admin-alert-msg"></span>
    </div>

    <!-- Scripts -->
    <script src="../js/session_check.js"></script>
    <script src="../js/admin_users.js"></script>
</body>
</html>
