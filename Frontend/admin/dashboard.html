<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Vendor Moderation</title>
    
    <!-- Design Foundation -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
    
    <!-- Icons & Fonts -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>

    <div class="admin-container" id="admin-main">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">ShopVerse Elite</div>
            
            <nav class="nav-list">
                <a href="dashboard.html" class="nav-link active">
                    <i class="ph ph-squares-four"></i> Dashboard
                </a>
                <a href="orders.html" class="nav-link">
                    <i class="ph ph-shopping-cart"></i> Orders
                </a>
                <a href="products.html" class="nav-link">
                    <i class="ph ph-package"></i> Products
                </a>
                <a href="payments.html" class="nav-link">
                    <i class="ph ph-credit-card"></i> Payments
                </a>
                <a href="vendors.html" class="nav-link">
                    <i class="ph ph-storefront"></i> Vendors
                </a>
                <a href="users.html" class="nav-link">
                    <i class="ph ph-users"></i> Customers
                </a>
            </nav>

            <div style="margin-top: auto;">
                <a href="../index.html" class="nav-link">
                    <i class="ph ph-arrow-left"></i> Back to Store
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="header-flex">
                <div>
                    <h1 class="page-title">Platform Moderation</h1>
                    <p style="color: var(--clr-muted);">Review and manage vendor applications.</p>
                </div>
            </div>

            <!-- Stats Row -->
            <div class="stats-row">
                <div class="stat-card">
                    <div class="stat-icon"><i class="ph ph-user-plus"></i></div>
                    <div>
                        <span class="stat-value" id="stat-pending-apps">0</span>
                        <span class="stat-label">Vendor Apps</span>
                    </div>
                </div>
                
                <!-- NEW: Quick Fulfillment Card -->
                <div class="stat-card" style="cursor:pointer; border-color:var(--clr-primary-light); background:rgba(124,58,237,0.05);" onclick="window.location.href='orders.html'">
                    <div class="stat-icon" style="background:var(--grad-primary); color:#fff;">
                        <i class="ph ph-truck"></i>
                    </div>
                    <div>
                        <span class="stat-value">Manage</span>
                        <span class="stat-label">Order Fulfillment</span>
                    </div>
                    <i class="ph ph-arrow-right" style="margin-left:auto; color:var(--clr-primary-light);"></i>
                </div>

                <div class="stat-card">
                    <div class="stat-icon" style="background:rgba(16,185,129,0.1); color:var(--clr-success);">
                        <i class="ph ph-storefront"></i>
                    </div>
                    <div>
                        <span class="stat-value">Active</span>
                        <span class="stat-label">Marketplace</span>
                    </div>
                </div>
            </div>

            <!-- Vendor Application Table -->
            <div class="order-table-container">
                <div class="table-header">
                    <h2 style="font-size: 1.1rem;">Pending Vendor Applications</h2>
                </div>
                
                <div class="table-wrapper" id="vendor-list">
                    <div style="text-align:center; padding: 4rem;">
                        <div class="btn-spinner" style="display:block; border-top-color:var(--clr-primary);"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Alert / Toast -->
    <div id="admin-alert" class="alert" style="position:fixed; bottom:2rem; right:2rem; z-index:100; margin-bottom:0; width:320px;">
        <span id="admin-alert-msg"></span>
    </div>

    <!-- Scripts -->
    <script src="../js/session_check.js"></script>
    <script>
        const BASE_URL = (() => {
          const proto = window.location.protocol;
          const host  = window.location.hostname || 'localhost';
          const port  = window.location.port ? `:${window.location.port}` : '';
          if (proto === 'file:') return 'http://localhost/Ecommerce_site/Backend';
          return `${proto}//${host}${port}/Ecommerce_site/Backend`;
        })();

        document.addEventListener('DOMContentLoaded', () => {
            fetchPendingVendors();
        });

        function showAlert(text, type='error') {
            const box = document.getElementById('admin-alert');
            const msg = document.getElementById('admin-alert-msg');
            box.className = `alert alert-${type} show`;
            msg.textContent = text;
            setTimeout(() => box.classList.remove('show'), 5000);
        }

        async function fetchPendingVendors() {
            const list = document.getElementById('vendor-list');
            try {
                const res = await fetch(`${BASE_URL}/admin/vendors.php?status=inactive`, { credentials: 'include' });
                const data = await res.json();
                
                if (data.success) {
                    document.getElementById('stat-pending-apps').textContent = data.vendors.length;
                    
                    if (data.vendors.length === 0) {
                        list.innerHTML = `<div class="empty-state">
                            <div class="empty-icon"><i class="ph ph-check-circle"></i></div>
                            <h3>No pending applications</h3>
                            <p style="color:var(--clr-muted);">All vendors are currently processed.</p>
                        </div>`;
                        return;
                    }
                    
                    let html = `
                        <table>
                            <thead>
                                <tr>
                                    <th>Store Name</th>
                                    <th>Applicant</th>
                                    <th>Email</th>
                                    <th style="text-align:right;">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;
                    
                    data.vendors.forEach(v => {
                        html += `
                            <tr>
                                <td style="font-weight:600; color:var(--clr-primary-light);">${escapeHTML(v.store_name)}</td>
                                <td>${escapeHTML(v.name)}</td>
                                <td style="color:var(--clr-muted);">${escapeHTML(v.email)}</td>
                                <td style="text-align:right;">
                                    <button class="btn-approve" style="padding: 0.5rem 1rem; background:var(--clr-success); color:#fff; border:none; border-radius:var(--radius-sm); cursor:pointer;" onclick="processVendor(${v.vendor_id}, 'approve')">Approve</button>
                                    <button class="btn-reject" style="padding: 0.5rem 1rem; background:rgba(239,68,68,0.1); color:var(--clr-error); border:1px solid var(--clr-error); border-radius:var(--radius-sm); cursor:pointer; margin-left:0.5rem;" onclick="processVendor(${v.vendor_id}, 'reject')">Deny</button>
                                </td>
                            </tr>
                        `;
                    });
                    
                    html += `</tbody></table>`;
                    list.innerHTML = html;
                }
            } catch(err) {
                list.innerHTML = '<div class="empty-state">Network error.</div>';
            }
        }

        async function processVendor(vendorId, actionMsg) {
            if(!confirm(`Are you sure you want to ${actionMsg} this store?`)) return;
            try {
                const res = await fetch(`${BASE_URL}/admin/vendors.php`, {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ vendor_id: vendorId, action: actionMsg }),
                    credentials: 'include'
                });
                const data = await res.json();
                if(data.success) {
                    showAlert(data.message, 'success');
                    fetchPendingVendors();
                } else {
                    showAlert(data.message);
                }
            } catch(e) { showAlert("Network error executing command."); }
        }

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag]));
        }
    </script>
</body>
</html>
