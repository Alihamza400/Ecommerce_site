<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Inventory | ShopVerse Elite</title>
    
    <!-- Design Foundation -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
    
    <!-- Icons & Fonts -->
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1/src/index.js" defer></script>
</head>
<body>

    <div class="admin-container" id="admin-main">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">ShopVerse Elite</div>
            
            <nav class="nav-list">
                <a href="dashboard.html" class="nav-link">
                    <i class="ph ph-squares-four"></i> Dashboard
                </a>
                <a href="orders.html" class="nav-link">
                    <i class="ph ph-shopping-cart"></i> Orders
                </a>
                <a href="products.html" class="nav-link active">
                    <i class="ph ph-package"></i> Products
                </a>
                <a href="payments.html" class="nav-link">
                    <i class="ph ph-credit-card"></i> Payments
                </a>
                <a href="vendors.html" class="nav-link">
                    <i class="ph ph-storefront"></i> Vendors
                </a>
                <a href="users.html" class="nav-link">
                    <i class="ph ph-users"></i> Customers
                </a>
            </nav>

            <div style="margin-top: auto;">
                <a href="../index.html" class="nav-link">
                    <i class="ph ph-arrow-left"></i> Back to Store
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="header-flex">
                <div>
                    <h1 class="page-title">Inventory Management</h1>
                    <p style="color: var(--clr-muted);">Track stock levels and product pricing.</p>
                </div>
            </div>

            <!-- Product Table -->
            <div class="order-table-container">
                <div class="table-header">
                    <h2 style="font-size: 1.1rem;">All Products</h2>
                    <div class="search-box" style="flex:1; max-width:300px; position:relative; margin-left:2rem;">
                        <i class="ph ph-magnifying-glass" style="position:absolute; left:1rem; top:50%; transform:translateY(-50%); color:var(--clr-muted);"></i>
                        <input type="text" id="product-search" placeholder="Search products..." style="width:100%; padding:0.5rem 1rem 0.5rem 2.5rem; background:var(--clr-surface-2); border:1px solid var(--clr-border); border-radius:var(--radius-sm); color:#fff; outline:none;" onkeyup="filterProducts()">
                    </div>
                </div>
                
                <div class="table-wrapper">
                    <table id="products-table">
                        <thead>
                            <tr>
                                <th>Product</th>
                                <th>Category</th>
                                <th>Price</th>
                                <th>Stock Remaining</th>
                                <th>Status</th>
                                <th style="text-align:right;">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="products-tbody">
                            <!-- JS will inject rows here -->
                            <tr>
                                <td colspan="6" style="text-align:center; padding: 4rem;">
                                    <div class="btn-spinner" style="display:block; border-top-color:var(--clr-primary);"></div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="../js/session_check.js?v=1.1"></script>
    <script src="../js/admin_products.js?v=1.1"></script>
</body>
</html>
