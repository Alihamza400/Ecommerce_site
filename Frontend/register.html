<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — ShopVerse</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css?v=9291" />
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1/src/index.js" defer></script>
  <script src="js/session_check.js"></script>
</head>
<body class="entrance-fade">
<main class="auth-page" id="register-page">

  <aside class="auth-panel">
    <div class="orb orb-1 float-slow"></div>
    <div class="orb orb-2 float-medium"></div>
    <div class="auth-panel-logo">✦ ShopVerse</div>
    <h1 class="auth-panel-tagline">Shop <span>Smarter</span>,<br>Live Better.</h1>
    <ul class="auth-features">
      <li class="auth-feature"><span class="auth-feature-icon">🚀</span><span class="auth-feature-text">Lightning-fast delivery worldwide</span></li>
      <li class="auth-feature"><span class="auth-feature-icon">🔒</span><span class="auth-feature-text">Secure checkout</span></li>
    </ul>
  </aside>

  <section class="auth-form-side">
    <div class="auth-card reveal">
      <div class="auth-card-header">
        <h2 class="auth-card-title">Create your account</h2>
        <p class="auth-card-subtitle">Already have an account? <a href="login.html">Sign in here</a></p>
      </div>

      <div class="alert alert-error" id="reg-alert" role="alert">
        <i class="ph ph-warning-circle"></i><span id="reg-alert-msg"></span>
      </div>

      <form id="register-form" class="reveal delay-2" class="reveal delay-2" novalidate>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="reg-name">Full Name</label>
            <div class="input-wrapper">
              <input class="form-input" type="text" id="reg-name" name="name" required />
              <i class="ph ph-user input-icon"></i>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-phone">Phone</label>
            <div class="input-wrapper">
              <input class="form-input" type="tel" id="reg-phone" name="phone" />
              <i class="ph ph-phone input-icon"></i>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-email">Email Address</label>
          <div class="input-wrapper">
            <input class="form-input" type="email" id="reg-email" name="email" required />
            <i class="ph ph-envelope input-icon"></i>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-password">Password</label>
          <div class="input-wrapper">
            <input class="form-input" type="password" id="reg-password" name="password" required />
            <i class="ph ph-lock input-icon"></i>
            <button type="button" class="btn-toggle-password" id="toggle-reg-pass">
              <i class="ph ph-eye" id="eye-reg-pass"></i>
            </button>
          </div>
          <div class="password-strength" id="strength-meter">
            <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
            <span class="strength-label" id="strength-label"></span>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-confirm">Confirm Password</label>
          <div class="input-wrapper">
            <input class="form-input" type="password" id="reg-confirm" name="confirm_password" required />
            <i class="ph ph-lock-key input-icon"></i>
            <button type="button" class="btn-toggle-password" id="toggle-reg-confirm">
              <i class="ph ph-eye" id="eye-reg-confirm"></i>
            </button>
          </div>
        </div>

        <div class="form-check">
          <input type="checkbox" id="reg-terms" required />
          <label class="form-check-label" for="reg-terms">I agree to the Terms of Service</label>
        </div>

        <button type="submit" class="btn-primary" id="reg-submit">
          <span class="btn-text">Create Account</span><span class="btn-spinner"></span>
        </button>

        <div class="auth-divider"><span>or join with</span></div>

        <a href="../Backend/oauth/google_login.php" class="btn-google-gigantic">
          <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google">
          <span>Sign up with Google</span>
        </a>
      </form>
    </div>
  </section>

</main>
<script src="js/auth.js"></script>
  <script src="js/animations.js?v=9676"></script>
</body>
</html>
