<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shopping Cart — ShopVerse</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css?v=9291" />
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1/src/index.js" defer></script>
  <script src="js/session_check.js"></script>
</head>
<body class="entrance-fade">
  <!-- Navigation -->
  <header class="site-header">
    <div class="nav-container">
      <a href="index.html" class="logo">✦ ShopVerse</a>
      <nav class="nav-links">
        <a href="index.html">All Products</a>
      </nav>
      <div class="nav-actions">
        <div id="auth-actions">
           <!-- Dynamic Auth State rendered by auth.js check -->
           <div class="loading-state" style="font-size:0.8rem">Authenticating...</div>
        </div>
      </div>
    </div>
  </header>

  <main id="cart-main" style="max-width: 1200px; margin: 4rem auto; padding: 0 1rem;">
    <div class="section-header">
      <h2>Your Shopping Cart</h2>
    </div>

    <!-- Alert System -->
    <div class="alert alert-error" id="cart-alert" role="alert" style="margin-bottom: 2rem;">
        <i class="ph ph-warning-circle"></i><span id="cart-alert-msg"></span>
    </div>

    <div class="cart-layout" style="display: grid; grid-template-columns: 2fr 1fr; gap: 2rem; align-items: start;">
        
        <!-- Cart Items List -->
        <div class="cart-items-container reveal" id="cart-items" class="reveal delay-2" class="reveal delay-2" style="background: var(--clr-surface-2); border: 1px solid var(--clr-border); border-radius: var(--radius-md); padding: 1.5rem;">
            <div class="loading-state">Loading your cart...</div>
        </div>

        <!-- Order Summary -->
        <div class="cart-summary" style="background: var(--clr-surface-2); border: 1px solid var(--clr-border); border-radius: var(--radius-md); padding: 1.5rem; position: sticky; top: 100px;">
            <h3 style="margin-bottom: 1.5rem; font-size: 1.25rem;">Order Summary</h3>
            
            <div style="display: flex; justify-content: space-between; margin-bottom: 1rem; color: var(--clr-muted);">
                <span>Subtotal</span>
                <span id="summary-subtotal" class="float-medium" style="color: var(--clr-text); font-weight: 500;">$0.00</span>
            </div>
            
            <div style="display: flex; justify-content: space-between; margin-bottom: 1rem; color: var(--clr-muted);">
                <span>Shipping</span>
                <span style="color: var(--clr-text); font-weight: 500;">Calculated at checkout</span>
            </div>
            
            <div style="display: flex; justify-content: space-between; margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--clr-border); font-size: 1.25rem; font-weight: 700;">
                <span>Total</span>
                <span id="summary-total">$0.00</span>
            </div>

            <button class="btn-primary" style="margin-top: 2rem; width: 100%; text-transform: uppercase; font-size: 0.9rem;" id="btn-checkout" class="btn-ripple" onclick="window.location.href='checkout.html'">
                Proceed to Checkout
            </button>
        </div>

    </div>
  </main>

  <style>
    /* Base Layout inherited from index.html + localized cart grids */
    .site-header { background: var(--clr-surface); border-bottom: 1px solid var(--clr-border); padding: 1rem 2rem; position: sticky; top: 0; z-index: 100; }
    .nav-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 1.5rem; font-weight: 800; background: var(--grad-primary); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .nav-links a { margin-right: 1.5rem; font-weight: 500; transition: var(--trans-fast); }
    .nav-links a:hover { color: var(--clr-primary-light); }
    .btn-ghost { padding: 0.5rem 1rem; font-weight: 600; cursor:pointer;}
    .btn-primary-sm { padding: 0.5rem 1rem; background: var(--grad-primary); border-radius: var(--radius-sm); font-weight: 600; color: #fff; cursor:pointer;}

    /* Cart Item styling */
    .cart-item { display: grid; grid-template-columns: 80px 1fr auto; gap: 1.5rem; padding-bottom: 1.5rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--clr-border); align-items: center; }
    .cart-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .cart-img-box { width: 80px; height: 80px; background: rgba(255,255,255,0.05); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 2rem; color: var(--clr-primary-light); }
    .cart-item-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.25rem; }
    .cart-item-brand { font-size: 0.8rem; color: var(--clr-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 0.5rem;}
    
    /* Quantity Controls */
    .qty-controls { display: flex; align-items: center; gap: 1rem; margin-top: 0.5rem; background: var(--clr-bg); width: max-content; padding: 0.25rem 0.5rem; border-radius: 99px; border: 1px solid var(--clr-border); }
    .qty-btn { background: transparent; border: none; color: var(--clr-text); display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; cursor: pointer; border-radius: 50%; transition: var(--trans-fast); }
    .qty-btn:hover { background: rgba(255,255,255,0.1); }
    .qty-val { font-weight: 600; font-size: 0.9rem; min-width: 20px; text-align: center; }
    
    .cart-item-price-col { display: flex; flex-direction: column; align-items: flex-end; gap: 1rem; }
    .cart-item-price { font-size: 1.2rem; font-weight: 700; color: var(--clr-accent); }
    .remove-btn { background: transparent; border: none; color: var(--clr-error); font-size: 0.85rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 0.25rem; opacity: 0.8; transition: var(--trans-fast); }
    .remove-btn:hover { opacity: 1; text-decoration: underline; }

    @media (max-width: 768px) {
        .cart-layout { grid-template-columns: 1fr !important; }
        .cart-item { grid-template-columns: 80px 1fr; }
        .cart-item-price-col { flex-direction: row; justify-content: space-between; align-items: center; grid-column: 1 / -1; margin-top: 0.5rem;}
    }
  </style>

  <script src="js/cart.js"></script>
  <script src="js/animations.js?v=9676"></script>
</body>
</html>
