[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:apache]
command=apache2-foreground
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/apache.log
stderr_logfile=/var/log/supervisor/apache.log

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx.log

[program:paymentsystem]
command=node server.js
directory=/app/PaymentSystem
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/payment.log
stderr_logfile=/var/log/supervisor/payment.log
environment=NODE_ENV="production"

[program:aiservice]
command=uvicorn main:app --host 0.0.0.0 --port 8000
directory=/app/AIService
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/ai.log
stderr_logfile=/var/log/supervisor/ai.log
